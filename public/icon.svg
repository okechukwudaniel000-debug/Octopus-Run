<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="25%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Top Rainbow Accent Banner -->
  <rect x="72" y="56" width="368" height="12" rx="6" fill="url(#rainbow)" filter="url(#glow)"/>

  <!-- Pixel Grid Backdrop Pattern -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="2">
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="192" x2="448" y2="192"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="320" x2="448" y2="320"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="192" y1="64" x2="192" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="320" y1="64" x2="320" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
  </g>

  <!-- Floating Score Crystals -->
  <rect x="100" y="160" width="28" height="28" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="3" transform="rotate(15 114 174)"/>
  <rect x="380" y="150" width="26" height="26" rx="4" fill="#06b6d4" stroke="#0284c7" stroke-width="3" transform="rotate(-20 393 163)"/>

  <!-- Horseshoe Magnet Icon in Top Right -->
  <g transform="translate(360, 240) scale(1.6)">
    <path d="M 12,6 A 10,10 0 0,0 32,6 L 32,24 L 25,24 L 25,7 A 3,3 0 0,1 19,7 L 19,24 L 12,24 Z" fill="#ef4444"/>
    <rect x="12" y="18" width="7" height="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
    <rect x="25" y="18" width="7" height="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- Octocat Hero Mascot -->
  <g transform="translate(144, 150) scale(3.5)">
    <!-- Rainbow Aura Trail -->
    <rect x="2" y="8" width="16" height="4" fill="#ec4899" rx="2" opacity="0.8"/>
    <rect x="0" y="13" width="18" height="4" fill="#8b5cf6" rx="2" opacity="0.8"/>
    <rect x="-2" y="18" width="20" height="4" fill="#3b82f6" rx="2" opacity="0.8"/>
    <rect x="0" y="23" width="18" height="4" fill="#10b981" rx="2" opacity="0.8"/>
    <rect x="2" y="28" width="16" height="4" fill="#f59e0b" rx="2" opacity="0.8"/>

    <!-- Octocat Body & Head -->
    <ellipse cx="32" cy="24" rx="16" ry="14" fill="#f8fafc"/>
    <polygon points="20,16 24,4 29,14" fill="#f8fafc"/>
    <polygon points="35,14 40,4 44,16" fill="#f8fafc"/>
    <polygon points="21,15 24,7 27,14" fill="#f43f5e"/>
    <polygon points="37,14 40,7 43,15" fill="#f43f5e"/>

    <!-- Face details -->
    <ellipse cx="32" cy="25" rx="11" ry="8" fill="#1e1b4b"/>
    <ellipse cx="28" cy="24" rx="2.5" ry="3.2" fill="#38bdf8"/>
    <ellipse cx="36" cy="24" rx="2.5" ry="3.2" fill="#38bdf8"/>
    <circle cx="27" cy="23" r="1" fill="#ffffff"/>
    <circle cx="35" cy="23" r="1" fill="#ffffff"/>
    <polygon points="32,27 30.5,29 33.5,29" fill="#fb7185"/>

    <!-- Tentacles -->
    <rect x="22" y="34" width="4" height="9" rx="2" fill="#f8fafc"/>
    <rect x="28" y="36" width="4" height="9" rx="2" fill="#f8fafc"/>
    <rect x="34" y="36" width="4" height="9" rx="2" fill="#f8fafc"/>
    <rect x="40" y="34" width="4" height="9" rx="2" fill="#f8fafc"/>
  </g>

  <!-- Bottom Brand Wordmark -->
  <text x="256" y="448" font-family="ui-monospace, monospace" font-size="36" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">OCTORUN</text>
</svg>
